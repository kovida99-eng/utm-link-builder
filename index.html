<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTM Link Builder</title>
<style>
  :root {
    --bg: #DDADE7; --card: #ffffff; --ink: #14232b; --muted: #5a6b74;
    --line: #cfd9de; --accent: #DDADE7; --accent-ink: #ffffff; --out: #e3f1ef;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a1f; --card: #172830; --ink: #e8f0f2; --muted: #9db0b8;
      --line: #2b414b; --accent: #DDADE7; --accent-ink: #DDADE7; --out: #10343a;
      --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form, .result { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-weight: 600; margin-top: 14px; }
  label:first-child { margin-top: 0; }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.875rem; }
  input {
    width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    font: inherit; font-size: 0.85rem; padding: 3px 10px; cursor: pointer; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
  }
  .chip:hover { border-color: var(--accent); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 200px; }
  .opt { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-weight: 400; }
  .opt input { width: auto; margin: 0; }
  .result { margin-top: 20px; background: var(--out); }
  .result h2 { font-size: 1rem; margin: 0 0 8px; }
  #output { word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9rem; min-height: 1.5em; }
  #msg { color: var(--err); margin: 8px 0 0; min-height: 1.25em; font-size: 0.9rem; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button.main, button.alt {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 6px; cursor: pointer;
  }
  button.main { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
  button.alt { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<main>
  <h1>UTM link builder</h1>
  <p class="sub">Add campaign tracking to any link, ready to paste into your posts, emails, and ads.</p>

  <form id="form" autocomplete="off" novalidate>
    <label for="url">Website URL <span class="hint">(required)</span></label>
    <input id="url" type="text" placeholder="https://example.com/landing-page">

    <div class="row">
      <div>
        <label for="source">Campaign source <span class="hint">(required)</span></label>
        <input id="source" type="text" placeholder="linkedin">
        <div class="chips" data-target="source">
          <button type="button" class="chip">linkedin</button>
          <button type="button" class="chip">facebook</button>
          <button type="button" class="chip">instagram</button>
          <button type="button" class="chip">newsletter</button>
          <button type="button" class="chip">twitter</button>
        </div>
      </div>
      <div>
        <label for="medium">Campaign medium <span class="hint">(required)</span></label>
        <input id="medium" type="text" placeholder="social">
        <div class="chips" data-target="medium">
          <button type="button" class="chip">social</button>
          <button type="button" class="chip">email</button>
          <button type="button" class="chip">cpc</button>
          <button type="button" class="chip">referral</button>
        </div>
      </div>
    </div>

    <label for="campaign">Campaign name <span class="hint">(required)</span></label>
    <input id="campaign" type="text" placeholder="spring-sale-2026">

    <div class="row">
      <div>
        <label for="term">Campaign term <span class="hint">(optional, paid keywords)</span></label>
        <input id="term" type="text" placeholder="running shoes">
      </div>
      <div>
        <label for="content">Campaign content <span class="hint">(optional, tells ads apart)</span></label>
        <input id="content" type="text" placeholder="blue-button">
      </div>
    </div>

    <label class="opt"><input id="clean" type="checkbox" checked> Make values lowercase and replace spaces with hyphens</label>
  </form>

  <section class="result" aria-live="polite">
    <h2>Your tracked link</h2>
    <div id="output">Fill in the required fields to build your link.</div>
    <p id="msg"></p>
    <div class="actions">
      <button class="main" id="copy" type="button" disabled>Copy link</button>
      <button class="alt" id="reset" type="button">Clear form</button>
    </div>
  </section>
</main>

<script>
  const ids = ["url", "source", "medium", "campaign", "term", "content"];
  const el = Object.fromEntries(ids.map(i => [i, document.getElementById(i)]));
  const out = document.getElementById("output");
  const msg = document.getElementById("msg");
  const copyBtn = document.getElementById("copy");
  const clean = document.getElementById("clean");
  let current = "";

  function tidy(value) {
    value = value.trim();
    return clean.checked ? value.toLowerCase().replace(/\s+/g, "-") : value;
  }

  function build() {
    current = "";
    copyBtn.disabled = true;
    msg.textContent = "";

    let raw = el.url.value.trim();
    const missing = ["source", "medium", "campaign"].filter(k => !el[k].value.trim());
    if (!raw || missing.length) {
      out.textContent = "Fill in the required fields to build your link.";
      return;
    }
    if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;

    let url;
    try {
      url = new URL(raw);
      if (!url.hostname.includes(".")) throw new Error("bad host");
    } catch (e) {
      out.textContent = "Fill in the required fields to build your link.";
      msg.textContent = "Enter a valid website address, like https://example.com.";
      return;
    }

    const map = { source: "utm_source", medium: "utm_medium", campaign: "utm_campaign", term: "utm_term", content: "utm_content" };
    for (const [field, param] of Object.entries(map)) {
      const v = tidy(el[field].value);
      if (v) url.searchParams.set(param, v);
      else url.searchParams.delete(param);
    }
    current = url.toString();
    out.textContent = current;
    copyBtn.disabled = false;
  }

  ids.forEach(i => el[i].addEventListener("input", build));
  clean.addEventListener("change", build);

  document.querySelectorAll(".chips").forEach(group => {
    group.addEventListener("click", e => {
      if (!e.target.classList.contains("chip")) return;
      el[group.dataset.target].value = e.target.textContent;
      build();
    });
  });

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(current);
      copyBtn.textContent = "Copied";
    } catch (e) {
      copyBtn.textContent = "Select and copy manually";
    }
    setTimeout(() => (copyBtn.textContent = "Copy link"), 1800);
  });

  document.getElementById("reset").addEventListener("click", () => {
    ids.forEach(i => (el[i].value = ""));
    build();
  });
</script>
</body>
</html>
